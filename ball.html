<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; -webkit-user-select:none; user-select:none; }
  #ball {
    width:90px; height:90px;
    transform-origin: 50% 78%;
  }
  svg { width:90px; height:90px; display:block; }
</style>
</head>
<body>
  <div id="ball">
    <svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg">
      <ellipse cx="45" cy="82" rx="22" ry="4" fill="rgba(0,0,0,.18)"/>
      <circle cx="45" cy="48" r="26" fill="#e23b6a"/>
      <path d="M28 36 q 10 8 4 18 q -8 2 -14 -6 q -4 -10 10 -12 z" fill="#f06d90"/>
      <path d="M50 28 q 14 2 16 14 q -8 6 -16 2 q -6 -6 0 -16 z" fill="#c41e4e"/>
      <path d="M34 52 q 16 10 28 2" fill="none" stroke="#fff4f7" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M30 44 q 8 -8 18 -2" fill="none" stroke="#fff4f7" stroke-width="1.6" stroke-linecap="round" opacity=".8"/>
      <path d="M48 58 q 8 6 16 -2" fill="none" stroke="#9d163c" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
<script>
const { ipcRenderer } = require('electron');
const ball = document.getElementById('ball');
ipcRenderer.on('ball-react', (_e, { rot, lift }) => {
  ball.style.transform = `translateY(${lift}px) rotate(${rot}deg)`;
});
</script>
</body>
</html>
