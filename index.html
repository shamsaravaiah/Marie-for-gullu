<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  #stage { position: relative; width: 220px; height: 200px; cursor: grab; }
  #stage:active { cursor: grabbing; }
  svg { width: 220px; height: 200px; display: block; }

  /* ---- facing ---- */
  .flip { transform-box: fill-box; transform-origin: center; transition: transform .12s; }
  .facing-left .flip { transform: scaleX(-1); }
  /* front view already looks at the user, so do not mirror it */
  .facing-front .flip { transform: none; }

  .pet { transform-box: fill-box; transform-origin: bottom center; }

  /* ---- idle ---- */
  .state-idle .pet { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { transform: translateY(0) scaleY(1); }
    50%     { transform: translateY(-1px) scaleY(1.03); }
  }

  /* ---- walk ---- */
  .state-walk .pet { animation: hop .42s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* ---- sleep (curled loaf) ---- */
  .state-sleep .pet { animation: snooze 4.6s ease-in-out infinite; }
  @keyframes snooze {
    0%,100% { transform: translateY(16px) scaleY(.70); }
    50%     { transform: translateY(13px) scaleY(.75); }
  }
  .state-sleep .leg { opacity: 0; }

  /* ---- eat ---- */
  .state-eat .head { transform-box: fill-box; transform-origin: 28% 96%; animation: chew .5s ease-in-out infinite; }
  @keyframes chew { 0%,100% { transform: rotate(20deg); } 50% { transform: rotate(27deg); } }

  /* ---- legs (walk cycle) ---- */
  .leg { transform-box: fill-box; transform-origin: 50% 0; }
  .state-walk .leg.f1, .state-walk .leg.b2 { animation: legA .42s ease-in-out infinite; }
  .state-walk .leg.f2, .state-walk .leg.b1 { animation: legB .42s ease-in-out infinite; }
  @keyframes legA { 0%,100% { transform: rotate(-16deg); } 50% { transform: rotate(16deg); } }
  @keyframes legB { 0%,100% { transform: rotate(16deg); } 50% { transform: rotate(-16deg); } }

  /* ---- tail ---- */
  .tail { transform-box: fill-box; transform-origin: 82% 88%; }
  .state-idle .tail { animation: wag 1.5s ease-in-out infinite; }
  .state-walk .tail { animation: wag .5s ease-in-out infinite; }
  .state-sleep .tail, .state-eat .tail { animation: wag 3.4s ease-in-out infinite; }
  @keyframes wag { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }

  /* ---- ears perk on walk ---- */
  .ear { transform-box: fill-box; transform-origin: bottom center; }
  .state-walk .ear { animation: perk .42s ease-in-out infinite; }
  @keyframes perk { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-5deg); } }

  /* ---- blink ---- */
  .eye-open { transform-box: fill-box; transform-origin: center; }
  .state-idle .eye-open, .state-walk .eye-open, .state-eat .eye-open { animation: blink 4.2s infinite; }
  @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
  .eye-closed { display: none; }
  .state-sleep .eye-open { display: none; }
  .state-sleep .eye-closed { display: block; }

  /* ---- lifted (scruff) — overrides everything ---- */
  .lifted .pet { animation: dangleBody 1.4s ease-in-out infinite; transform-origin: top center; }
  @keyframes dangleBody { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
  .lifted .leg { animation: dangle 1s ease-in-out infinite !important; transform-origin: 50% 0; }
  @keyframes dangle { 0%,100% { transform: rotate(-12deg) translateY(7px); } 50% { transform: rotate(12deg) translateY(7px); } }
  .lifted .tail { animation: dangleT 1.3s ease-in-out infinite !important; }
  @keyframes dangleT { 0%,100% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }

  /* ---- image sprite mode ---- */
  .sprite { width: 220px; height: 200px; object-fit: contain; object-position: center bottom; transform-box: border-box; }
  .state-walk .sprite { animation: waddle .45s ease-in-out infinite; }
  @keyframes waddle { 0%,100% { transform: translateY(0) rotate(-2.5deg); } 50% { transform: translateY(-6px) rotate(2.5deg); } }
  .state-eat .sprite, .state-eat .sheet { animation: eatdip .6s ease-in-out infinite; transform-origin: 70% 100%; }
  @keyframes eatdip { 0%,100% { transform: rotate(9deg) translateY(2px); } 50% { transform: rotate(13deg) translateY(5px); } }
  /* Cat eat art faces left. Mirror it while she faces the bowl so her tongue lands in the food. */
  .pet-cat.state-eat.facing-right .flip { transform: scaleX(-1); }
  .pet-cat.state-eat.facing-left .flip { transform: none; }
  .pet-cat.state-eat .sheet { animation: eatchew .5s ease-in-out infinite; transform-origin: 34% 100%; }
  @keyframes eatchew { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }

  /* ---- sprite-sheet mode (real frame animation) ---- */
  .sheet {
    display: block; margin: 0 auto;
    width: 200px; height: 200px;
    background-repeat: no-repeat;
    background-position: 0 0;
    background-size: calc(var(--n) * 200px) 200px;
  }
  .sheet.cycling { animation: sheetcycle var(--dur) steps(var(--n)) infinite; }
  @keyframes sheetcycle { from { background-position-x: 0; } to { background-position-x: calc(var(--n) * -200px); } }
  /* play once and hold the LAST real frame (jump-none ends on frame n-1, not the blank n-th) */
  .sheet.cycle-once { animation: sheetonce var(--dur) steps(var(--n), jump-none) 1 both; }
  @keyframes sheetonce { from { background-position-x: 0; } to { background-position-x: calc((var(--n) - 1) * -200px); } }

  /* ---- floating Zzz / heart ---- */
  #zzz { position:absolute; top:72px; right:54px; font:700 24px/1 -apple-system,sans-serif; color:#7aa7d8; opacity:0; pointer-events:none; }
  .state-sleep #zzz { animation: floatz 2.6s ease-in-out infinite; }
  @keyframes floatz { 0% { opacity:0; transform:translateY(6px) scale(.7);} 40%{opacity:1;} 100%{opacity:0; transform:translateY(-22px) scale(1.1);} }
  #heart { position:absolute; top:38px; left:55%; transform:translateX(-50%); font-size:22px; opacity:0; pointer-events:none; }
  .happy #heart { animation: pop .7s ease-out 1; }
  @keyframes pop { 0%{opacity:0; transform:translate(-50%,0) scale(.4);} 35%{opacity:1; transform:translate(-50%,-16px) scale(1.1);} 100%{opacity:0; transform:translate(-50%,-34px) scale(.9);} }
</style>
</head>

function svgWrap(inner){ return `<svg viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`; }

const stage = document.getElementById('stage');
const host = document.getElementById('pethost');
let currentPet = null;

// Per-pet, per-state sprite sheets (each a horizontal frame strip).
const SHEETS = {
  cat: {
    walk:     { file: 'images/cat_walk.png',     frames: 8, dur: 1.6 },
    wag:      { file: 'images/cat_wag.png',      frames: 8, dur: 1.5 },
    run:      { file: 'images/cat_run.png',      frames: 8, dur: 0.9 },

    lift:     { file: 'images/cat_lift.png',     frames: 4, dur: 1.4 },
    eat:      { file: 'images/cat_eat.png',      frames: 8, dur: 1.8 },
    groom:    { file: 'images/cat_groom.png',    frames: 8, dur: 2.4 },
    hungry:   { file: 'images/cat_hungry.png',   frames: 4, dur: 2.2, front: true },
    rollover: { file: 'images/cat_rollover.png', frames: 4, dur: 2.2 },
    biscuit:  { file: 'images/cat_biscuit.png',  frames: 4, dur: 1.8, front: true },
    play:     { file: 'images/cat_play.png',     frames: 8, dur: 1.6 },

  },

    eat:   { file: 'images/shiba_eat.png',   frames: 25, dur: 2.2 },
    lift:  { file: 'images/shiba_lift.png',  frames: 15, dur: 0.8 },
    idle:  { file: 'images/shiba_idle.png',  frames: 1,  dur: 3.0 },
  },
  husky: {
    walk:  { file: 'images/husky_walk.png',  frames: 25, dur: 1.4 },
    sleep: { file: 'images/husky_sleep.png', frames: 25, dur: 3.4 },
    eat:   { file: 'images/husky_eat.png',   frames: 25, dur: 2.2 },
    lift:  { file: 'images/husky_lift.png',  frames: 10, dur: 0.55 },

};

let currentMode = 'idle';
let lifted = false;

function showSVG(pet){ if(currentPet===pet) host.innerHTML = svgWrap(PETS[pet]||PETS.cat); }

function trySingle(pet){
  const probe = new Image();
  probe.onload = () => { if(currentPet===pet) host.innerHTML = `<div class="flip"><img class="pet sprite" src="images/${pet}.png" draggable="false"></div>`; };
  probe.onerror = () => showSVG(pet);
  probe.src = `images/${pet}.png`;
}

// Pick the right sheet for the current state and apply it to the .sheet element.
function applyAnim(){
  const el = host.querySelector('.sheet');
  const cfg = SHEETS[currentPet];
  if(!el || !cfg) return;
  let a, play = 'none';
  const use = (key, how) => { if (cfg[key] && cfg[key]._ok) { a = cfg[key]; play = how; return true; } return false; };
  if (lifted && use('lift', 'once')) {}
  else if (currentMode === 'sleep') use('sleep', 'loop');
  else if (currentMode === 'eat') use('eat', 'loop');
  else if (currentMode === 'hungry') use('hungry', 'loop');
  else if (currentMode === 'groom') use('groom', 'loop');
  else if (currentMode === 'biscuit') use('biscuit', 'loop');
  else if (currentMode === 'play') use('play', 'loop');
  else if (currentMode === 'rollover') use('rollover', 'once');
  else if (currentMode === 'run') use('run', 'loop');
  else if (currentMode === 'wag') use('wag', 'loop');
  else if (currentMode === 'walk') use('walk', 'loop');
  else if (cfg.idle && cfg.idle._ok) { a = cfg.idle; play = (cfg.idle.frames > 1) ? 'loop' : 'none'; }
  else { a = (cfg.walk && cfg.walk._ok) ? cfg.walk : cfg.sleep; play = 'none'; }
  if(!a) return;
  stage.classList.toggle('facing-front', !!a.front);
  el.style.backgroundImage = `url('${a.file}')`;
  el.style.setProperty('--n', a.frames);
  el.style.setProperty('--dur', a.dur + 's');
  el.classList.toggle('cycling', play === 'loop');
  el.classList.toggle('cycle-once', play === 'once');
}

function render(pet){
  if(pet===currentPet) return;
  currentPet=pet;
  ['cat','shiba','husky','fortune'].forEach(p => stage.classList.remove('pet-'+p));
  stage.classList.add('pet-'+pet);
  const cfg = SHEETS[pet];
  if(!cfg){ trySingle(pet); return; }
  // Preload every defined animation so applyAnim knows which exist.
  Object.values(cfg).forEach(a => {
    if(a && a.file && a._ok === undefined){
      const im = new Image();
      im.onload = () => { a._ok = true; if(currentPet===pet) applyAnim(); };
      im.onerror = () => { a._ok = false; };
      im.src = a.file;
    }
  });
  const base = cfg.walk || cfg.sleep;
  const probe = new Image();
  probe.onload = () => { if(currentPet!==pet) return; base._ok = true;
    host.innerHTML = `<div class="flip"><div class="pet sheet"></div></div>`; applyAnim(); };
  probe.onerror = () => trySingle(pet);
  probe.src = base.file;
}
const ACTION_MODES = ['idle','walk','wag','run','sleep','eat','groom','hungry','rollover','biscuit','play'];

const HUNGRY_SOUNDS = [1, 2, 3, 4, 5].map(i => `sounds/clips/hungry-0${i}.mp3`);
const PURR_SOUND = encodeURI('sounds/Cat Purr - Sound Effect for editing.mp3');
const MEOWS = Array.from({length:12}, (_,i) => `sounds/clips/meow-${String(i+1).padStart(2,'0')}.mp3`);
const SOUND_POOL = {
  eat:      [0, 1, 2, 5],
  groom:    [3, 4, 7],
  wag:      [6, 8, 1],
  run:      [8, 9, 2],
  rollover: [10, 6, 11],
  biscuit:  [11, 4, 7],
  poke:     [1, 6, 8, 10],
};
let meowAudio = null;
let hungryAudio = null;
let purrAudio = null;
let hungryIndex = 0;

function playFile(src, volume){
  const a = new Audio(src);
  a.volume = volume;
  a.play().catch(() => {});
  return a;
}
function playPool(action){
  if (currentPet !== 'cat') return;
  const pool = SOUND_POOL[action];
  if (!pool) return;
  const src = MEOWS[pool[Math.floor(Math.random() * pool.length)]];
  if (meowAudio) { meowAudio.pause(); meowAudio = null; }
  meowAudio = playFile(src, 0.8);
}
function playHungry(){
  if (currentPet !== 'cat' || currentMode !== 'hungry') return;
  if (hungryAudio && !hungryAudio.ended && !hungryAudio.paused) return;
  const src = HUNGRY_SOUNDS[hungryIndex % HUNGRY_SOUNDS.length];
  hungryIndex = (hungryIndex + 1) % HUNGRY_SOUNDS.length;
  hungryAudio = playFile(src, 0.9);
  hungryAudio.onended = () => {
    hungryAudio = null;
    if (currentMode === 'hungry') playHungry();
  };
}
function stopHungry(){
  if (!hungryAudio) return;
  hungryAudio.onended = null;
  hungryAudio.pause();
  hungryAudio = null;
}
function playPurr(){
  if (currentPet !== 'cat' || currentMode !== 'sleep') return;
  if (purrAudio && !purrAudio.paused) return;
  purrAudio = new Audio(PURR_SOUND);
  purrAudio.loop = true;
  purrAudio.volume = 0.4;
  purrAudio.play().catch(() => {});
}
function stopPurr(){
  if (!purrAudio) return;
  purrAudio.pause();
  purrAudio = null;
}
function onModeSound(mode){
  if (currentPet !== 'cat') { stopHungry(); stopPurr(); return; }
  if (mode === 'hungry') { stopPurr(); hungryIndex = 0; playHungry(); }
  else if (mode === 'sleep') { stopHungry(); playPurr(); }
  else { stopHungry(); stopPurr(); }
}

function meowNow(){
  if (currentPet !== 'cat' || currentMode === 'hungry') return;
  const resumePurr = currentMode === 'sleep';
  if (resumePurr) stopPurr();
  playPool('poke');
  if (resumePurr && meowAudio) {
    meowAudio.onended = () => { if (currentMode === 'sleep') playPurr(); };
  }
}
function scheduleMeow(first){
  // First meow is 5 minutes after launch. Later ones stay uneven so they feel like a surprise.
  const wait = first ? 5 * 60 * 1000 : (5 + Math.random() * 10) * 60 * 1000;
  setTimeout(() => {
    meowNow();
    scheduleMeow(false);
  }, wait);
}
scheduleMeow(true);

function setMode(mode){
  const prev = currentMode;
  currentMode = mode;
  ACTION_MODES.forEach(m => stage.classList.remove('state-'+m));
  stage.classList.add('state-'+mode);
  applyAnim();
  if (mode !== prev) onModeSound(mode);
}
function setFacing(f){ stage.classList.remove('facing-left','facing-right'); stage.classList.add('facing-'+f); }

ipcRenderer.on('state', (_e,{mode,facing,pet}) => {
  const petChanged = pet !== currentPet;
  render(pet);
  setMode(mode);
  setFacing(facing);
  if (petChanged) onModeSound(currentMode);
});
render('cat');

/* ============ interaction ============ */
let down=false, moved=0, lx=0, ly=0, lifting=false;

stage.addEventListener('mousedown', (e)=>{ down=true; moved=0; lx=e.screenX; ly=e.screenY; ipcRenderer.send('drag-start'); });
window.addEventListener('mousemove', (e)=>{
  if(!down) return;
  const dx=e.screenX-lx, dy=e.screenY-ly; lx=e.screenX; ly=e.screenY;
  moved += Math.abs(dx)+Math.abs(dy);
  if(moved>5 && !lifting){ lifting=true; lifted=true; stage.classList.add('lifted'); applyAnim(); }
  ipcRenderer.send('drag-move', { x:e.screenX, y:e.screenY, lifted:lifting });
});
window.addEventListener('mouseup', ()=>{
  if(!down) return;
  down=false;
  if(lifting){ lifting=false; lifted=false; stage.classList.remove('lifted'); applyAnim(); }
  ipcRenderer.send('drag-end');
  if(moved<5){ ipcRenderer.send('poke'); stage.classList.add('happy'); setTimeout(()=>stage.classList.remove('happy'),750); }
});
stage.addEventListener('contextmenu', (e)=>{ e.preventDefault(); ipcRenderer.send('context-menu'); });
</script>
</body>
