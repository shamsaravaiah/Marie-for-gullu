<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Welcome</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Avenir Next", "Segoe UI", sans-serif;
    color: #4c3640;
    background: #fff6f3;
    padding: 22px 24px 18px;
    display: flex;
    flex-direction: column;
  }
  .dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .dots i {
    width: 7px; height: 7px; border-radius: 99px;
    background: #f0d3db; display: block;
  }
  .dots i.on { background: #e48aa3; width: 18px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { margin: 0 0 14px; font-size: 14px; line-height: 1.45; color: #6e5560; }
  .hero {
    align-self: center;
    width: 150px; height: 132px;
    object-fit: contain;
    margin: 2px 0 8px;
  }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input[type="text"] {
    width: 100%;
    border: 1.5px solid #f0d0d8;
    background: #fff;
    border-radius: 12px;
    padding: 11px 12px;
    font: inherit;
    font-size: 16px;
    color: #4c3640;
    outline: none;
  }
  input[type="text"]:focus { border-color: #e48aa3; }
  .stepper {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 6px 0 12px;
  }
  .stepper button {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid #f0d0d8; background: #fff;
    color: #c45d78; font-size: 20px; line-height: 1; cursor: pointer;
  }
  .stepper button:disabled { opacity: 0.35; cursor: default; }
  .count { font-size: 32px; font-weight: 600; min-width: 36px; text-align: center; }
  .tips { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .tip {
    display: flex; gap: 10px; align-items: center;
    background: #fff; border-radius: 14px; padding: 8px 10px;
  }
  .tip img { width: 58px; height: 52px; object-fit: contain; flex: none; }
  .tip b { display: block; font-size: 13px; margin-bottom: 2px; }
  .tip span { font-size: 12.5px; line-height: 1.35; color: #6e5560; }
  .grow { flex: 1; }
  .bar { display: flex; justify-content: space-between; gap: 10px; margin-top: 16px; }
  button.btn {
    border: none; border-radius: 999px; padding: 10px 18px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button.btn:disabled { opacity: 0.4; cursor: default; }
  .primary { background: #e48aa3; color: #fff; }
  .ghost { background: transparent; color: #a06a7a; }
</style>
</head>
<body>
  <div class="dots" id="dots"></div>
  <div id="view" class="grow"></div>
  <div class="bar">
    <button class="btn ghost" id="back" type="button">Back</button>
    <button class="btn primary" id="next" type="button">Next</button>
  </div>
<script>
const { ipcRenderer } = require('electron');
const view = document.getElementById('view');
const back = document.getElementById('back');
const next = document.getElementById('next');
const dots = document.getElementById('dots');
let step = 0;
let name = '';
let times = 3;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}
function cat() { return esc(name.trim()); }

function paintDots() {
  dots.innerHTML = [0, 1, 2].map(i => `<i class="${i === step ? 'on' : ''}"></i>`).join('');
}

function render() {
  paintDots();
  back.style.visibility = step === 0 ? 'hidden' : 'visible';
  if (step === 0) {
    next.textContent = 'Next';
    next.disabled = name.trim().length === 0;
    view.innerHTML = `
      <img class="hero" src="images/welcome_idle.png" alt="A fluffy white cat with a pink bow" />
      <h1>A cat on your desktop</h1>
      <p>She stays along the bottom of your screen. She walks, naps, plays, and keeps you company while you work.</p>
      <label for="name">What will you call her?</label>
      <input id="name" type="text" maxlength="16" placeholder="Mochi" autocomplete="off" />
    `;
    const input = document.getElementById('name');
    input.value = name;
    input.focus();
    input.addEventListener('input', () => {
      name = input.value.replace(/\s+/g, ' ').replace(/^\s/, '');
      next.disabled = name.trim().length === 0;
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && name.trim()) go(1);
    });
  } else if (step === 1) {
    next.textContent = 'Next';
    next.disabled = false;
    view.innerHTML = `
      <h1>${cat()} gets hungry</h1>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Fewer">−</button>
        <div class="count" id="count">${times}</div>
        <button type="button" id="plus" aria-label="More">+</button>
      </div>
    `;
    document.getElementById('minus').disabled = times <= 1;
    document.getElementById('plus').disabled = times >= 12;
    document.getElementById('minus').onclick = () => { if (times > 1) { times--; render(); } };
    document.getElementById('plus').onclick = () => { if (times < 12) { times++; render(); } };
  } else {
    next.textContent = 'Meet ' + name.trim();
    next.disabled = false;
    view.innerHTML = `
      <h1>Life with ${cat()}</h1>
      <div class="tips">
        <div class="tip">
          <img src="images/welcome_idle.png" alt="" />
          <div><b>Click ${cat()}</b><span>She notices you, and a little heart pops up.</span></div>
        </div>
        <div class="tip">
          <img src="images/welcome_play.png" alt="" />
          <div><b>Drag ${cat()}</b><span>Pick her up and set her down somewhere else.</span></div>
        </div>
        <div class="tip">
          <img src="images/welcome_eat.png" alt="" />
          <div><b>Right-click to feed ${cat()}</b><span>Drop food when she is hungry. She will run over and eat.</span></div>
        </div>
        <div class="tip">
          <img src="images/welcome_sleep.png" alt="" />
          <div><b>The same menu</b><span>Toss ${cat()} a yarn ball, or tuck her in for a nap. Left alone, she wanders, grooms, and a butterfly visits now and then.</span></div>
        </div>
      </div>
    `;
  }
}

function go(n) {
  if (n === 1) name = name.trim();
  if (n < 0 || n > 2) return;
  if (n > step && step === 0 && !name) return;
  step = n;
  render();
}

back.onclick = () => go(step - 1);
next.onclick = () => {
  if (step < 2) go(step + 1);
  else ipcRenderer.send('welcome-done', { name: name.trim(), times });
};

render();
</script>
</body>
</html>
