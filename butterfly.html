<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; overflow:hidden; }
  svg { width:72px; height:72px; display:block; }
  .wing { transform-box: fill-box; transform-origin: center right; animation: flap .28s ease-in-out infinite; }
  .wing.right { transform-origin: center left; animation-delay: -.14s; }
  @keyframes flap {
    0%, 100% { transform: scaleX(1) rotate(0deg); }
    50% { transform: scaleX(.45) rotate(8deg); }
  }
</style>
</head>
<body>
  <svg viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
    <g class="wing">
      <ellipse cx="22" cy="30" rx="16" ry="12" fill="#7ec8ff" opacity=".95"/>
      <ellipse cx="20" cy="46" rx="12" ry="10" fill="#f7b4d4"/>
    </g>
    <g class="wing right">
      <ellipse cx="50" cy="30" rx="16" ry="12" fill="#7ec8ff" opacity=".95"/>
      <ellipse cx="52" cy="46" rx="12" ry="10" fill="#f7b4d4"/>
    </g>
    <ellipse cx="36" cy="38" rx="3.2" ry="12" fill="#3a3350"/>
    <circle cx="36" cy="24" r="3.4" fill="#3a3350"/>
    <path d="M33 22 q -6 -10 -2 -14" stroke="#3a3350" stroke-width="1" fill="none"/>
    <path d="M39 22 q 6 -10 2 -14" stroke="#3a3350" stroke-width="1" fill="none"/>
  </svg>
</body>
</html>
